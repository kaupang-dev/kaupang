name: Integration

# Heavier, Docker-backed checks that exercise the live paths the fast CI can't.
# Runs on main + PRs (and on demand). Ubuntu runners ship Docker + buildx.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: compose · registry · digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash scripts/integration-compose.sh

  build:
    name: build · compose build + push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash scripts/integration-build.sh

  swarm:
    name: swarm · stack deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash scripts/integration-swarm.sh

  oras:
    name: oras · bundle + catalog over OCI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: oras-project/setup-oras@v1
      - run: npm ci
      - run: npm run build
      - run: bash scripts/integration-oras.sh

  k8s:
    name: k8s · kind · kubectl apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: azure/setup-kubectl@v4
      - name: Install kind
        run: |
          curl -sSLo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
      - run: npm ci
      - run: npm run build
      - run: bash scripts/integration-k8s.sh
