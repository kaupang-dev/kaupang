name: CI

on:
  push:
  pull_request:

# A newer push to the same ref cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback: typecheck, the offline vitest suite, and a clean tsup build.
  # No Docker daemon or registry — the daemon-backed integration job is separate.
  test:
    name: test · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22'] # vitest 4 requires Node 20+ (CLI runtime supports >=18)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Guard against example rot: every example must load and render a plan offline.
  # --dry-run touches no daemon, so this is fast and hermetic.
  examples:
    name: example · ${{ matrix.dir }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: minimal, cmd: up web }
          - { dir: build-from-dockerfile, cmd: up app }
          - { dir: runonce-migrations, cmd: up app }
          - { dir: catalog-presets, cmd: up data }
          - { dir: secrets, cmd: up app }
          - { dir: kubernetes, cmd: up app }
          - { dir: pipeline, cmd: run deploy }
          - { dir: json-config, cmd: up web }
          - { dir: longhall, cmd: up market }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build # builds @kaupang/core then @kaupang/cli
      - run: node packages/cli/dist/cli.js ${{ matrix.cmd }} --dry-run --cwd examples/${{ matrix.dir }}
