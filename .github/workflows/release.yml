name: Release

# On a v* tag: publish all three packages to npm (with provenance) and push the studio
# Docker image to ghcr.io. e.g. `git tag v0.2.0 && git push --tags`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance (OIDC)
  packages: write # push the studio image to ghcr.io

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Tag must match all package versions (lockstep)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in core studio cli; do
            PKG="$(node -p "require('./packages/$p/package.json').version")"
            echo "packages/$p=$PKG  tag=$TAG"
            [ "$TAG" = "$PKG" ] || { echo "::error::packages/$p version $PKG != tag v$TAG"; exit 1; }
          done

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Publish in dependency order: core → studio → cli. Scoped → --access public (also
      # set via publishConfig). --provenance attaches a signed attestation linking each
      # tarball to this repo + commit (needs id-token: write above AND a public repo).
      - run: npm publish -w @kaupang/core --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish -w @kaupang/studio --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish -w @kaupang/cli --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Build + push the studio image AFTER npm publish — its Dockerfile installs the
  # just-published @kaupang/studio at the tag version.
  studio-image:
    name: studio image → ghcr.io
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3 # arm64 emulation
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: packages/studio
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kaupang-studio:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/kaupang-studio:latest
